<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <script
      src="https://kit.fontawesome.com/864ca2bc1a.js"
      crossorigin="anonymous"
    ></script>
    <title>Rock Paper Scissors</title>
  </head>
  <body>
    <div>
      <h1>Rock Paper Scissors</h1>
    </div>
    <div class="container">
      <div class="scoreBoard">
        <div id="playerLabel" class="scoreLabel">Player</div>
        <div id="compLabel" class="scoreLabel">Computer</div>
        <span class="playerScore">0</span>:
        <span class="computerScore">0</span>
      </div>
      <div class="resultPerRound"></div>
      <div class="weapon">
        <h3>Choose your weapon:</h3>
      </div>
      <div class="content">
        <button id="rock" class="buttons">
          <span class="fa-regular fa-hand-back-fist icon"></span>Rock
        </button>

        <button id="paper" class="buttons">
          <span class="fa-regular fa-hand icon"></span>Paper
        </button>

        <button id="scissors" class="buttons">
          <span class="fa-regular fa-hand-scissors icon"></span>Scissors
        </button>
        <div class="moves"></div>
        <div class="gameOver">
          <h3>Game Over!</h3>
        </div>
        <div class="result"></div>
      </div>
      <button class="restart">Restart</button>
    </div>
    <script src="index.js"></script>
  </body>
</html>
