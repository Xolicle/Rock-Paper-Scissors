<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <script
      src="https://kit.fontawesome.com/864ca2bc1a.js"
      crossorigin="anonymous"
    ></script>
    <title>Rock Paper Scissors</title>
  </head>
  <body>
    <div class="container">
      <div class="subTitle">
        <div>
          <h2>Player</h2>
          <p class="playerScore">0</p>
        </div>
        <div>
          <h2>Computer</h2>
          <p class="computerScore">0</p>
        </div>
      </div>
      <!-- <div class="resultPerRound">
        <p>
          player chose
          <span id="playerChoice"></span>
        </p>
        <p>
          computer chose
          <span id="computerChoice"></span>
        </p>
      </div> -->
      <div>
        <h3 class="weapon">Choose your weapon:</h3>
      </div>
      <div class="content">
        <button id="rock" class="buttons">
          <span class="fa-regular fa-hand-back-fist icon"></span>Rock
        </button>

        <button id="paper" class="buttons">
          <span class="fa-regular fa-hand icon"></span>Paper
        </button>

        <button id="scissors" class="buttons">
          <span class="fa-regular fa-hand-scissors icon"></span>Scissors
        </button>
        <div class="moves"></div>

        <div class="result">Result</div>

        <div class="winner">hbhb</div>
      </div>
      <button class="restart">Restart</button>
    </div>
    <script src="index.js"></script>
  </body>
</html>
