<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <script
      src="https://kit.fontawesome.com/864ca2bc1a.js"
      crossorigin="anonymous"
    ></script>
    <title>Rock Paper Scissors</title>
  </head>
  <body>
    <div class="container">
      <div class="content">
        <button id="rock">
          <span class="fa-regular fa-hand-back-fist icon"></span>Rock
        </button>

        <button id="paper">
          <span class="fa-regular fa-hand icon"></span>Paper
        </button>

        <button id="scissors">
          <span class="fa-regular fa-hand-scissors icon"></span>Scissors
        </button>
        <div class="result">bbui</div>
        <div class="winner">hbhb</div>
      </div>
    </div>
    <script src="index.js"></script>
  </body>
</html>
